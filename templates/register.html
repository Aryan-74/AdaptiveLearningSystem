{% extends "layout.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4">
            <div class="text-center mb-4">
                <div class="bg-primary-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px;">
                    <i class="fa-solid fa-user-plus fs-4"></i>
                </div>
                <h3 class="section-title">Create Learner Account</h3>
                <p class="text-muted small">Join the Adaptive Learning System research study</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label font-weight-medium text-slate-700">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-slate-500"><i class="fa-regular fa-user"></i></span>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Alex Johnson" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-medium text-slate-700">Email Address / Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-slate-500"><i class="fa-regular fa-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="alex@university.edu" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label font-weight-medium text-slate-700">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-slate-500"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label font-weight-medium text-slate-700">Confirm Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-slate-500"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="confirm_password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 font-weight-semibold rounded-3">
                    Register Account <i class="fa-solid fa-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="text-center mt-4 border-top pt-3">
                <span class="text-muted small">Already registered?</span>
                <a href="{{ url_for('login') }}" class="text-primary font-weight-medium small ms-1">Login here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
